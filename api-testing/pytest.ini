[pytest]
testpaths = suites
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --strict-markers
markers =
    api: REST API automated test scenario
    auth: Authentication and OTP verification endpoints
    driver: Driver telemetry and status endpoints
    user: Passenger lifecycle, fare, and booking endpoints
    wallet: Digital wallet and eWallet balance endpoints
    ecgo_swap: ECGO SuperApps battery swap coupon endpoints
    security: Security, SQLi, XSS, token tampering defense
    boundary: Boundary Value Analysis and input integrity
    new_features: Tests for Features 2, 3, and 5
