[pytest]
testpaths = Frontend/Feature/Step_Definition
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --strict-markers
markers =
    # 4 Pilar QA Markers
    positive_true: [Pilar 1] Input valid diharapkan sukses (Happy Path)
    positive_false: [Pilar 2] Format input valid namun ditolak aturan bisnis (Duplicate/Expired)
    business_logic: [Pilar 2] Pengujian logika bisnis dan kalkulasi sistem (Business Logic)
    account_lifecycle: Pengujian siklus akun (registrasi, session, update, logout, hapus akun)
    negative_true: [Pilar 3] Input invalid ditolak dengan pesan validasi yang tepat
    negative_false: [Pilar 4] Input ekstrem / malicious ditolak secara aman tanpa crash (Security & BVA)
    happy_flow: Alur pengujian sukses end-to-end lengkap
    pilar1: [Pilar 1] Positive True & Functional Verification
    pilar2: [Pilar 2] Positive False & Business Logic
    pilar3: [Pilar 3] Negative True & Boundary Value Analysis
    pilar4: [Pilar 4] Negative False & Security / Resilience
    pilar1_positive: Pilar 1 - Positive Testing (Happy Path & Functional Verification)
    pilar2_negative: Pilar 2 - Negative Testing (Error Handling & Penanganan Kesalahan)
    pilar3_boundary: Pilar 3 - Boundary Value Analysis (BVA - Batas Nilai & Empty State)
    pilar4_security: Pilar 4 - Security, Input Sanitization & UI State Resilience
    normal_booking: Modul pemesanan langsung / Normal Instant Ride
    advance_booking: Modul pemesanan terjadwal / Scheduled Ride
    
    # Kategori Fitur & Pacing
    smoke: Smoke testing alur kritis
    regression: Regression test suite lengkap
    auth: Modul otentikasi dan registrasi akun
    booking: Modul pemesanan ojek online (EvRide)
    profile: Modul profil dan akun pengguna (Me Tab)
    human_like: Skenario dengan human-like pacing dan perekaman video otomatis MP4
    record_video: Perekaman layar perangkat ke video MP4
    location_permission: Skenario izin lokasi dan location phone service
    security: Skenario pengujian keamanan, injeksi, dan sanitasi payload
    activity: Modul aktivitas dan riwayat transaksi pesanan (Activity Tab)
    race_condition: Pengujian concurrency & penanganan race condition multi-user
    fare_argo: Pengujian kalkulasi harga argo berbasis konfigurasi Dashboard Admin
    driver_dispatch: Pengujian dispatching order saat driver online
    driver_busy: Pengujian isolasi status driver yang sedang aktif mengantar
    payment_switch: Pengujian fleksibilitas pergantian metode pembayaran
    cashless_deduction: Pengujian pemotongan saldo cashless dompet digital akurat
    pricing_engine: Pengujian komprehensif engine kalkulasi harga dan 6 kondisi bisnis EvMoto
    platform_fee: Pengujian penerapan biaya platform seamless 10%
    waiting_fee: Pengujian penambahan biaya tunggu driver setelah toleransi 15 menit
    coupon_discount: Pengujian pemotongan kupon diskon promosi Rp 5.000
    penalty_fee: Pengujian penambahan denda pembatalan dan penalti pengguna
    ewallet_charge: Pengujian biaya surcharge 2% untuk pembayaran E-Wallet (GoPay & OVO)
    cancellation_fase_a: Pengujian pembatalan sebelum driver tiba di titik jemput (Fase A)
    cancellation_fase_b: Pengujian pembatalan saat masa tenggang 15 menit penjemputan (Fase B)
    cancellation_flow: Pengujian menyeluruh alur pembatalan dan settlement PRD v1.1
    no_show: Pengujian pembatalan otomatis sistem karena customer no-show >= 30 menit (Fase D)
    boundary_test: Pengujian batas ambang waktu tunggu (BVA 901s dan 1799s)
    negative_state: Pengujian pencegahan dan penolakan skenario pembatalan invalid
    order_behaviour: Pengujian matriks 16 skenario order behaviour dan tingkatan jarak (Dekat, Sedang, Jauh, Sangat Jauh)

    # Driver App Automation Markers
    driver_app: Skenario otomasi aplikasi EvMoto Driver (com.evmoto.driver.app)
    drv_register: Modul pendaftaran mitra pengemudi baru EvMoto Driver
    background_overlay: Skenario background standby dan floating overlay window pesanan driver
    drv_login: Modul login dan autentikasi mitra pengemudi EvMoto Driver
    drv_home: Modul beranda, status kerja online/offline, dan GI EvMoto Driver
    drv_menu: Modul menu, rekening, eWallet ECGO, pengaturan akun, dan logout EvMoto Driver
    drv_wallet: Modul eWallet ECGO, transfer saldo, bayar tagihan, dan Tarik Dana EvMoto Driver
    drv_activity: Modul aktivitas, dashboard Guarantee Income (GI), revenue, dan referral EvMoto Driver
    drv_booking: Modul booking, dispatching, dan argo pricing engine EvMoto Driver
    admin_dashboard: Pengujian portal Admin Dashboard Web & REST API
    dispatch_batch: Pengujian fitur penyebaran order batch driver dan konfigurasi radius band
    batch_dispatch: Pengujian alur multi-order batch dispatch driver tanpa countdown
    e2e: Pengujian alur end-to-end terintegrasi antar aktor
