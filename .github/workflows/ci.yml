# Regression EvMoto di GitHub Actions: Admin (Chrome headless), API (staging + mock), Mobile User & Driver
# di emulator Android asli (APK dev), lalu satu laporan PDF gabungan.
# Hanya environment dev/staging; staging_guard membatalkan run yang mengarah ke production.
# Semua kredensial dari GitHub Secrets (lihat README "Secrets yang dibutuhkan"); tidak ada nilai rahasia di file ini.
name: evmoto-regression

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Suite yang dijalankan (all / admin / api / mobile)"
        default: all
      file_filter:
        description: "Regex nama file test yang dijalankan, mis. ^test_(login|drv_login)[.]py - kosongkan untuk semua"
        default: ""
      lanjutkan_dari:
        description: "Nomor run yang di-pause untuk dilanjutkan (file test yang sudah selesai di sana tidak diulang). Kosongkan untuk run baru."
        default: ""
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "0 1 * * 1-5"   # 08:00 WIB, Senin-Jumat

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: dev
  HEADLESS: "true"
  LARK_WEBHOOK_URL: ""
  PYTHONUTF8: "1"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Quality gate (method hilang, nama tak terdefinisi, assertion palsu, domain production, file ganda)
        run: |
          pip install pyflakes
          python qa-tools/quality_gate.py admin
          python qa-tools/quality_gate.py mobile

  admin:
    needs: quality-gate
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","admin"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Tulis .env dari Secrets
        run: printf '%s\n' "$ENV_WEB" > web-dashboard/.env
        env: { ENV_WEB: "${{ secrets.ENV_WEB_DASHBOARD }}" }
      - name: Ambil hasil percobaan sebelumnya (lanjutkan run yang di-pause)
        if: ${{ github.run_attempt > 1 || inputs.lanjutkan_dari != '' }}
        env: { GH_TOKEN: "${{ github.token }}", DARI: "${{ inputs.lanjutkan_dari || github.run_id }}" }
        run: gh run download "$DARI" -R "${{ github.repository }}" -p "hasil-admin*" -D sebelumnya || true
      - name: Regression Admin Dashboard (Chrome headless)
        env: { RESUME_DIR: sebelumnya }
        run: python qa-tools/run_all.py --suite admin
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "hasil-admin-a${{ github.run_attempt }}", path: qa-tools/runs/, retention-days: 14 }

  api:
    needs: quality-gate
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","api"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Tulis .env dari Secrets
        run: printf '%s\n' "$ENV_MOBILE" > mobile-apps/.env
        env: { ENV_MOBILE: "${{ secrets.ENV_MOBILE_APPS }}" }
      - name: Regression API (staging; endpoint yang belum ada di staging dijawab mock dan ditandai)
        run: python qa-tools/run_all.py --suite api --mock-services
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "hasil-api-a${{ github.run_attempt }}", path: qa-tools/runs/, retention-days: 14 }

  mobile:
    needs: quality-gate
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","mobile"]'), inputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 6
      INSTALL_APK: "0"
      RESUME_DIR: sebelumnya
      FILE_INCLUDE: ${{ inputs.file_filter }}
    steps:
      - uses: actions/checkout@v4
      - name: Aktifkan KVM (emulator cepat tanpa jendela)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Pasang dependensi Python dan Appium
        run: |
          pip install -r requirements.txt
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version
      - name: Tulis .env dari Secrets
        run: printf '%s\n' "$ENV_MOBILE" > mobile-apps/.env
        env: { ENV_MOBILE: "${{ secrets.ENV_MOBILE_APPS }}" }
      - name: Ambil APK dev (terenkripsi di Release) lalu buka enkripsinya
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PASSPHRASE: ${{ secrets.APK_PASSPHRASE }}
        run: |
          mkdir -p apk
          gh release download apk-dev -R "${{ github.repository }}" -p 'evmoto-apk-dev.tar.gz.enc' -D apk             || { echo "::error::APK terenkripsi belum ada di Release apk-dev (lihat apps/README.md)"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:APK_PASSPHRASE \
            -in apk/evmoto-apk-dev.tar.gz.enc | tar -xz -C apk
          ls apk
      - name: Ambil hasil percobaan sebelumnya (lanjutkan run yang di-pause)
        if: ${{ github.run_attempt > 1 || inputs.lanjutkan_dari != '' }}
        env: { GH_TOKEN: "${{ github.token }}", DARI: "${{ inputs.lanjutkan_dari || github.run_id }}" }
        run: gh run download "$DARI" -R "${{ github.repository }}" -p "hasil-mobile-${{ matrix.shard }}*" -D sebelumnya || true
      - name: Regression Mobile User & Driver di emulator Android (APK asli)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35   # Play Services lebih baru; Android 11 (API 30) terlalu lama untuk aplikasi EvMoto
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -dns-server 8.8.8.8,1.1.1.1
          disable-animations: true
          script: |
            adb root || true
            sleep 5 && adb wait-for-device
            adb shell "setprop persist.sys.locale id-ID; setprop ctl.restart zygote" || echo "Ganti bahasa lewat adb gagal; Appium (language=id) tetap mengatur bahasa"
            sleep 25 && adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done; getprop persist.sys.locale'
            adb install -r -g apk/evmoto-user.apk
            adb install -r -g apk/evmoto-driver.apk
            mkdir -p bukti
            echo "== Cek jaringan dari dalam emulator ke backend staging ==" | tee bukti/cek_jaringan.txt
            adb shell "ping -c 3 -W 3 evmotodev.justkidding.app" >> bukti/cek_jaringan.txt 2>&1 || echo "ping gagal" >> bukti/cek_jaringan.txt
            adb shell "getprop net.dns1; getprop persist.sys.locale; getprop ro.build.version.sdk" >> bukti/cek_jaringan.txt 2>&1 || true
            adb shell "dumpsys package com.google.android.gms | grep -m1 versionCode" >> bukti/cek_jaringan.txt 2>&1 || true
            cat bukti/cek_jaringan.txt
            adb logcat -c || true
            nohup adb logcat -v time > bukti/logcat.txt 2>&1 &
            nohup appium --address 127.0.0.1 --port 4723 --log-level warn > appium.log 2>&1 &
            sleep 15
            python qa-tools/run_all.py --suite mobile cross
      - name: Kumpulkan bukti kegagalan (screenshot + struktur layar)
        if: always()
        run: |
          mkdir -p bukti
          cp -r mobile-apps/reports/screenshots bukti/ 2>/dev/null || true
          cp appium.log bukti/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hasil-mobile-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: |
            qa-tools/runs/
            bukti/
          retention-days: 14

  laporan:
    needs: [admin, api, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Gabungkan hasil semua job lalu buat PDF
        run: |
          python qa-tools/merge_runs.py artifacts gabungan
          python qa-tools/report.py gabungan
      - uses: actions/upload-artifact@v4
        with: { name: laporan-regression-pdf, path: gabungan/, retention-days: 30 }
